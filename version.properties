# TarangFX version policy file. REQUIRED: CI fails if it is missing, malformed or altered
# outside the rules below.
#
# major  The current MAJOR version line (the "1" in 1.4.27).
#        * Feature/fix pull requests must NOT change this file.
#        * A major release is prepared by a maintainer in a dedicated pull request that changes
#          ONLY this file, and ONLY to (latest released major + 1). After it is merged, the
#          "Major release" workflow is triggered manually and publishes <major>.0.0.
#
# MINOR and PATCH are never written here: CI derives them from the git release tags on every
# merge to main (patch +1, or minor +1 with the "semver:minor" label; each rolls over at 100).
major=1
