# Automatic release: every merge to main publishes the next version in the current major line.
#   patch + 1 by default; minor + 1 (patch 0) when the merged PR carries the "semver:minor" label.
#   Minor and patch roll over at 100; x.99.99 requires a manual major release.
# The very first run (no tags yet) publishes <major>.0.0 = 1.0.0.
#
# NO release is published for:
#   * Dependabot pull requests (dependency / GitHub Actions bumps), and
#   * pull requests labelled "skip-release" (maintainer opt-out, e.g. README or CI-only changes).
# Their changes simply ship with the next real release; versions are always computed from the
# latest tag, so skipping a merge never creates a gap or reuses a number.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release # strictly one release at a time, in merge order
  cancel-in-progress: false

jobs:
  plan:
    name: Plan version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the merged PR's labels
    outputs:
      version: ${{ steps.next.outputs.version }}
      pending: ${{ steps.next.outputs.pending }}
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Versioning policy
        run: |
          python3 tools/versioning/version.py selftest
          python3 tools/versioning/version.py validate
      - name: Inspect the merged PR (author, labels)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0] // {}' 2>/dev/null || echo '{}')
          number=$(jq -r '.number // "none"' <<<"$pr")
          author=$(jq -r '.user.login // ""' <<<"$pr")
          labels=$(jq -r '[.labels[]?.name] | join(",")' <<<"$pr")
          echo "PR #$number by '$author', labels: [$labels]"
          skip=false; reason=""
          if [ "$author" = "dependabot[bot]" ]; then
            skip=true; reason="Dependabot dependency update"
          elif [[ ",$labels," == *",skip-release,"* ]]; then
            skip=true; reason="labelled skip-release"
          fi
          bump=patch
          [[ ",$labels," == *",semver:minor,"* ]] && bump=minor
          { echo "skip=$skip"; echo "bump=$bump"; } >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "### No release for PR #$number ($reason). It ships with the next release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Next version
        id: next
        if: steps.pr.outputs.skip != 'true'
        env:
          BUMP: ${{ steps.pr.outputs.bump }}
        run: python3 tools/versioning/version.py next --bump "$BUMP"
      - name: Summary
        if: steps.pr.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PENDING: ${{ steps.next.outputs.pending }}
        run: |
          if [ "$PENDING" = "true" ]; then
            echo "### Major bump pending: run the **Major release** workflow to publish it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Publishing **v$VERSION**" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.pending == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit
