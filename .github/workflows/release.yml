# Automatic release: every merge to main publishes the next version in the current major line.
#   patch + 1 by default; minor + 1 (patch 0) when the merged PR carries the "semver:minor" label.
#   Minor and patch roll over at 100; x.99.99 requires a manual major release.
# The very first run (no tags yet) publishes <major>.0.0 = 1.0.0.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release # strictly one release at a time, in merge order
  cancel-in-progress: false

jobs:
  plan:
    name: Plan version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the merged PR's labels
    outputs:
      version: ${{ steps.next.outputs.version }}
      pending: ${{ steps.next.outputs.pending }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Versioning policy
        run: |
          python3 tools/versioning/version.py selftest
          python3 tools/versioning/version.py validate
      - name: Bump type from the merged PR
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          if printf '%s\n' "$labels" | grep -qx 'semver:minor'; then bump=minor; else bump=patch; fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump"
      - name: Next version
        id: next
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: python3 tools/versioning/version.py next --bump "$BUMP"
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PENDING: ${{ steps.next.outputs.pending }}
        run: |
          if [ "$PENDING" = "true" ]; then
            echo "### Major bump pending: run the **Major release** workflow to publish it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Publishing **v$VERSION**" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.pending == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit
