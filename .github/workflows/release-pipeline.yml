# Reusable: build signed release APKs for a version, then publish the tag + GitHub Release.
# Called by release.yml (automatic, every merge to main) and major-release.yml (manual).
#
# SECURITY: the signing key exists only as encrypted repository secrets. It is decoded into the
# runner's temp dir with owner-only permissions, used by Gradle via environment variables, and
# deleted in an always() step. Only the publish job gets a write token.
name: Release pipeline

on:
  workflow_call:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH to publish
        required: true
        type: string
      major:
        description: true for a manual major release
        required: false
        type: boolean
        default: false
    secrets:
      TFX_KEYSTORE_BASE64:
        required: true
      TFX_KEYSTORE_PASSWORD:
        required: true
      TFX_KEY_ALIAS:
        required: true
      TFX_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  NDK_VERSION: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Signed APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false # one ABI's transient failure must not cancel the other
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (last MIT-licensed major; v6+ bundles a proprietary caching component)
        with:
          # Clean-room release builds: never restore or save the shared Gradle cache, so an official
          # release cannot be affected by stale or poisoned cache state (cache poisoning is a known
          # CI supply-chain risk).
          cache-disabled: true
      - name: Install NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.TFX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=Signing::Repository secrets TFX_KEYSTORE_BASE64 etc. are not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed release APK
        env:
          TFX_RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          TFX_RELEASE_STORE_PASSWORD: ${{ secrets.TFX_KEYSTORE_PASSWORD }}
          TFX_RELEASE_KEY_ALIAS: ${{ secrets.TFX_KEY_ALIAS }}
          TFX_RELEASE_KEY_PASSWORD: ${{ secrets.TFX_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          ABI: ${{ matrix.abi }}
        run: bash tools/ci/gradlew-retry.sh :app:assembleRelease :app:verifyApkHygieneRelease "-Pabi=$ABI" "-PtfxVersionName=$VERSION" --stacktrace
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Verify signature and name the artifact
        env:
          VERSION: ${{ inputs.version }}
          ABI: ${{ matrix.abi }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose "$apk" | grep -E "Verified using v(2|3) scheme"
          mkdir -p out
          cp "$apk" "out/TarangFX-$VERSION-$ABI.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-${{ matrix.abi }}
          path: out/*.apk
          retention-days: 14

  publish:
    name: Publish v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag + release; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ inputs.major }}
          SHA: ${{ github.sha }}
        run: |
          kind="Release"; [ "$MAJOR" = "true" ] && kind="Major release"
          {
            echo "## TarangFX v$VERSION"
            echo
            echo "$kind built and signed by CI from \`${SHA:0:7}\`."
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`TarangFX-$VERSION-arm64-v8a.apk\` | Android phones and tablets (64-bit ARM) |"
            echo "| \`TarangFX-$VERSION-x86_64.apk\` | Emulators and x86 Chromebooks |"
            echo
            echo "Verify your download against \`SHA256SUMS.txt\`. 100% offline: the app has no internet permission."
          } > notes.md
          gh release create "v$VERSION" dist/*.apk dist/SHA256SUMS.txt \
            --target "$SHA" --title "TarangFX v$VERSION" --notes-file notes.md --generate-notes --latest
