name: Bug report
description: Something in TarangFX doesn't work as expected
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TarangFX. Please search existing issues first.
        **Security problems must NOT be reported here**: use a private security advisory (see README → Security).
  - type: input
    id: version
    attributes:
      label: TarangFX version
      description: Settings → About, or the release you installed (e.g. 1.2.3)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature
      options: [Trim, Merge, Mix, Split, Ringtone, Record, Convert, Video to audio, AI Denoise, FX & EQ, Tag editor, Outputs, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Trim\n2. Pick a 10-minute MP3\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove any personal data first.
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I follow the Code of Conduct in the README.
          required: true
