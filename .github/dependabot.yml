# Weekly dependency + GitHub Actions updates. Titles use Conventional Commits ("build(deps): ...")
# so they pass the PR-title check; each update still goes through the full CI and review.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # gradle/actions v6+ moved caching into a proprietary component with separate Terms of Use.
      # TarangFX's toolchain stays fully open source (AGPL project), so we stay on MIT-licensed v5.
      - dependency-name: "gradle/actions*"
        versions: [">= 6.0.0"]
